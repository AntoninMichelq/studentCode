# Fabrique StudentCode pour Windows et Linux.
# - étiquette « v1.2.3 » poussée : construit, vérifie, puis publie la version sur GitHub ;
# - lancement manuel (onglet Actions → Release → Run workflow) : construit et vérifie seulement,
#   les fichiers sont téléchargeables depuis la page du lancement.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Lire la version
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' studentcode/main.py)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Étiquette $GITHUB_REF_NAME ≠ version $VERSION du code"; exit 1
          fi
      - name: Vérifier la syntaxe
        run: python3 -m py_compile studentcode/*.py && bash -n install.sh packaging/install-linux.sh

  linux:
    needs: check
    timeout-minutes: 40
    runs-on: ubuntu-22.04   # glibc ancienne : l'app marche aussi sur les distributions plus récentes
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libasound2 libxkbfile1
      - name: Dépendances
        run: pip install -r packaging/requirements.txt
      - name: Empaqueter
        run: pyinstaller --noconfirm packaging/studentcode.spec
      - name: Autotest de l'app empaquetée
        env:
          QT_QPA_PLATFORM: offscreen
          STUDENTCODE_SELFTEST_OUT: ${{ runner.temp }}/selftest.txt
        run: |
          set +e
          timeout 300 dist/StudentCode/StudentCode --selftest > /dev/null 2>&1
          code=$?
          cat "$STUDENTCODE_SELFTEST_OUT" || echo "(aucun résultat écrit)"
          # résultat visible dans le résumé du lancement (gh run view), sans ouvrir les journaux
          if [ $code -ne 0 ]; then
            echo "::error title=Autotest Linux (code $code)::$(tr '\n' '|' < "$STUDENTCODE_SELFTEST_OUT" 2>/dev/null | cut -c1-900)"
            exit 1
          fi
          grep '^ATTENTION' "$STUDENTCODE_SELFTEST_OUT" | while read -r l; do echo "::warning title=Autotest Linux::$l"; done
      - name: Archives
        run: |
          NAME="StudentCode-$VERSION-linux-x86_64"
          mkdir -p "out/$NAME"
          mv dist/StudentCode "out/$NAME/StudentCode"
          cp packaging/install-linux.sh README.md CHANGELOG.md "out/$NAME/"
          tar -C out -czf "out/$NAME.tar.gz" "$NAME"
          ./scripts/make-release.sh
          mv "dist/StudentCode-$VERSION.tar.gz" "out/StudentCode-$VERSION-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*.tar.gz

  windows:
    needs: check
    timeout-minutes: 40
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r packaging/requirements.txt
      - name: Empaqueter
        run: pyinstaller --noconfirm packaging/studentcode.spec
      - name: Autotest de l'app empaquetée
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $out = "$env:RUNNER_TEMP\selftest.txt"
          $env:STUDENTCODE_SELFTEST_OUT = $out
          $p = Start-Process -FilePath "dist\StudentCode\StudentCode.exe" -ArgumentList "--selftest" -PassThru
          $null = $p.Handle   # sans cette ligne, PowerShell perd parfois le code de sortie
          if (-not $p.WaitForExit(300000)) { $p.Kill(); $code = "délai dépassé" } else { $code = $p.ExitCode }
          $text = if (Test-Path $out) { Get-Content $out -Raw } else { "(aucun résultat écrit : l'app s'est arrêtée avant l'autotest)" }
          Write-Output $text
          # résultat visible dans le résumé du lancement (gh run view), sans ouvrir les journaux
          $short = ($text -replace "`r?`n", " | ")
          if ($short.Length -gt 900) { $short = $short.Substring($short.Length - 900) }
          if ("$code" -ne "0") {
            Write-Output "::error title=Autotest Windows (code $code)::$short"
            exit 1
          }
          foreach ($l in ($text -split "`r?`n")) { if ($l -like "ATTENTION*") { Write-Output "::warning title=Autotest Windows::$l" } }
      - name: Version portable (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist\StudentCode -DestinationPath "out\StudentCode-$env:VERSION-windows-x64.zip"
      - name: Installateur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:VERSION" packaging\studentcode.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup en échec" }
          Move-Item "dist\StudentCode-$env:VERSION-windows-x64-setup.exe" out\
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  publish:
    # publie ce qui a réussi, même si l'un des deux systèmes a échoué
    if: always() && github.ref_type == 'tag' && needs.check.result == 'success' && (needs.linux.result == 'success' || needs.windows.result == 'success')
    needs: [check, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh out
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "SCode (Python) $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
