# Publie une version quand on pousse une étiquette « v1.2.3 ».
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que l'étiquette correspond à la version du code
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' studentcode/main.py)"
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Étiquette $GITHUB_REF_NAME ≠ version $VERSION"; exit 1; }
      - name: Vérifier la syntaxe
        run: python3 -m py_compile studentcode/*.py && bash -n install.sh
      - name: Construire l'archive
        run: ./scripts/make-release.sh
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "StudentCode $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
